<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>سفر در زمان: حضرت صالح (ع) | فانوس یادگیری</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <!-- پیکربندی سراسری پلتفرم فانوس یادگیری -->
  <script src="../../config.js"></script>
  <style>
    :root {
      --bg-deep: #0b162c;
      --bg-mid: #142a4d;
      --parchment: #fdf7e9;
      --parchment-2: #f4e4c2;
      --gold: #d49a2a;
      --gold-soft: #f8d878;
      --turquoise: #1d7a78;
      --turquoise-dark: #125655;
      --ink: #2c1e12;
      --ink-soft: #5c4632;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Vazirmatn', 'Tahoma', system-ui, sans-serif;
      background: radial-gradient(circle at 50% 25%, #1d3c6a 0%, var(--bg-mid) 45%, var(--bg-deep) 100%);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      overflow: hidden;
    }

    .gate-card {
      width: 100%;
      max-width: 460px;
      background: linear-gradient(180deg, var(--parchment) 0%, var(--parchment-2) 100%);
      border: 3px solid var(--gold);
      border-radius: 24px;
      padding: 26px 22px 22px;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55), inset 0 0 36px rgba(212, 154, 42, 0.16);
      animation: cardIn 0.35s ease;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(14px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .lantern-orb {
      width: 74px;
      height: 74px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 32%, #fff9db 0%, #eab038 60%, #a86c10 100%);
      border: 3px solid #fff8e2;
      box-shadow: 0 0 0 3px #c98f22, 0 0 28px rgba(248, 216, 120, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, var(--turquoise), var(--turquoise-dark));
      color: #fff9e6;
      border: 1.5px solid var(--gold-soft);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 14px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 900;
      color: var(--ink);
      line-height: 1.4;
    }

    p {
      margin: 0 auto 18px;
      font-size: 13.8px;
      line-height: 1.85;
      color: var(--ink-soft);
      max-width: 390px;
    }

    .spinner-track {
      width: 100%;
      max-width: 280px;
      height: 10px;
      margin: 8px auto 12px;
      background: #e3cfa8;
      border: 1.5px solid #c59b52;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .spinner-bar {
      position: absolute;
      inset: 0;
      width: 45%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--turquoise), #e6a92e, var(--turquoise));
      animation: slideLoad 1.25s ease-in-out infinite;
    }

    @keyframes slideLoad {
      0% { transform: translateX(120%); }
      100% { transform: translateX(-230%); }
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      padding: 11px 22px;
      border-radius: 14px;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--turquoise), var(--turquoise-dark));
      color: #fffef6;
      border: 2px solid var(--gold-soft);
      box-shadow: 0 8px 20px rgba(18, 86, 85, 0.32);
    }

    .btn-secondary {
      background: #fffaf0;
      color: var(--ink);
      border: 2px solid #c9a66b;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .sub-note {
      margin-top: 14px;
      font-size: 11.8px;
      color: #7c6343;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main id="fanoos-boot-root" class="gate-card" role="status" aria-live="polite">
    <div class="lantern-orb">🏮</div>
    <div class="brand-badge">✨ پلتفرم فانوس یادگیری</div>
    <h1>سفر در زمان به سرزمین ثمود</h1>
    <p>در حال آماده‌سازی سفر در زمان به سرزمین ثمود...</p>
    <div class="spinner-track"><div class="spinner-bar"></div></div>
    <div class="sub-note">لطفاً چند لحظه صبر کن تا نقشه و پیشرفت تو بارگذاری شود</div>
  </main>

  <script>
  (function () {
    'use strict';

    /* =========================================================
       1. خواندن پارامترهای آدرس و بررسی اعتبار ورود
       ========================================================= */
    var rootEl = document.getElementById('fanoos-boot-root');
    var params = new URLSearchParams(window.location.search);
    var classId = (params.get('class') || '').trim();
    var sid = (params.get('sid') || '').trim();
    var snameParam = (params.get('sname') || '').trim();
    var gid = (params.get('gid') || 'saleh').trim() || 'saleh';
    var age = (params.get('age') || '').trim();

    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showEntryGate() {
      rootEl.innerHTML =
        '<div class="lantern-orb">🏮</div>' +
        '<div class="brand-badge">✨ پلتفرم فانوس یادگیری</div>' +
        '<h1>ورود از طریق تالار فانوس یادگیری</h1>' +
        '<p>برای شروع ماجراجویی <strong>حضرت صالح (ع)</strong> و ذخیره خودکار پیشرفتت در کلاس، لطفاً از طریق تالار اصلی فانوس یادگیری وارد شو.</p>' +
        '<div class="btn-row">' +
          '<a class="btn btn-primary" href="../../index.html">🏠 ورود به تالار فانوس یادگیری</a>' +
        '</div>' +
        '<div class="sub-note">اطلاعات کلاس یا شناسه مسافر در آدرس یافت نشد</div>';
    }

    function showLoadError(detail) {
      rootEl.innerHTML =
        '<div class="lantern-orb">⚠️</div>' +
        '<div class="brand-badge">✨ پلتفرم فانوس یادگیری</div>' +
        '<h1>خطا در بارگذاری بازی</h1>' +
        '<p>متأسفانه فایل اصلی بازی در دسترس نبود. اتصال اینترنت را بررسی کن و دوباره تلاش کن.</p>' +
        (detail ? '<div class="sub-note" style="margin:0 0 14px;">' + escapeHtml(detail) + '</div>' : '') +
        '<div class="btn-row">' +
          '<button type="button" class="btn btn-primary" onclick="window.location.reload()">🔄 تلاش مجدد</button>' +
          '<a class="btn btn-secondary" href="../../index.html' + (classId ? '?class=' + encodeURIComponent(classId) : '') + '">🏠 بازگشت به تالار</a>' +
        '</div>';
    }

    if (!classId || !sid) {
      showEntryGate();
      return;
    }

    /* =========================================================
       2. توابع استخراج امن اطلاعات از پاسخ سرور فانوس
       ========================================================= */
    function parseJsonSafe(val) {
      if (typeof val !== 'string') return val;
      try { return JSON.parse(val); } catch (e) { return null; }
    }

    function looksLikeState(obj) {
      if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return false;
      return (
        'highestUnlocked' in obj ||
        'completedStations' in obj ||
        'collectedCards' in obj ||
        'discoveredSecrets' in obj ||
        'mistakes' in obj ||
        'teacherAnswers' in obj ||
        'finishedGame' in obj ||
        'seenGuide' in obj
      );
    }

    function extractStateFromEntry(entry, targetGid) {
      if (!entry) return null;
      var parsed = parseJsonSafe(entry);
      if (!parsed || typeof parsed !== 'object') return null;

      if (parsed.state != null) {
        var st = parseJsonSafe(parsed.state);
        if (st && typeof st === 'object') return st;
      }
      if (parsed.progress && typeof parsed.progress === 'object' && !Array.isArray(parsed.progress)) {
        if (parsed.progress[targetGid]) {
          var pg = parseJsonSafe(parsed.progress[targetGid]);
          if (pg && typeof pg === 'object') return pg.state ? parseJsonSafe(pg.state) : pg;
        }
        if (looksLikeState(parsed.progress)) return parsed.progress;
      }
      if (parsed.games && typeof parsed.games === 'object' && parsed.games[targetGid]) {
        var gm = parseJsonSafe(parsed.games[targetGid]);
        if (gm && typeof gm === 'object') return gm.state ? parseJsonSafe(gm.state) : gm;
      }
      if (parsed.states && typeof parsed.states === 'object' && parsed.states[targetGid]) {
        var sm = parseJsonSafe(parsed.states[targetGid]);
        if (sm && typeof sm === 'object') return sm.state ? parseJsonSafe(sm.state) : sm;
      }
      if (looksLikeState(parsed)) return parsed;
      return null;
    }

    function extractApiBundle(raw) {
      var result = {
        className: '',
        studentName: snameParam,
        serverState: null,
        teacherQuestions: []
      };

      if (!raw || typeof raw !== 'object') {
        if (!result.studentName) result.studentName = 'مسافر عزیز';
        return result;
      }

      var data = (raw.data && typeof raw.data === 'object') ? raw.data : raw;
      var clsObj = (data.class && typeof data.class === 'object')
        ? data.class
        : ((raw.class && typeof raw.class === 'object') ? raw.class : {});

      result.className = String(
        data.className ||
        raw.className ||
        clsObj.className ||
        clsObj.name ||
        data.name ||
        raw.name ||
        ''
      ).trim();

      var listPools = [
        data.progress, raw.progress, clsObj.progress,
        data.records, raw.records,
        data.students, raw.students, clsObj.students
      ];

      // استخراج نام دانش‌آموز از فهرست کلاس در صورت نبود sname در آدرس
      if (!result.studentName) {
        for (var p = 0; p < listPools.length && !result.studentName; p++) {
          var pool = parseJsonSafe(listPools[p]);
          if (Array.isArray(pool)) {
            for (var i = 0; i < pool.length; i++) {
              var item = pool[i];
              if (!item || typeof item !== 'object') continue;
              var itemSid = String(item.studentId || item.sid || item.id || '').trim();
              if (itemSid === sid) {
                var nm = String(item.studentName || item.sname || item.name || item.fullName || '').trim();
                if (nm) { result.studentName = nm; break; }
              }
            }
          } else if (pool && typeof pool === 'object' && pool[sid] && typeof pool[sid] === 'object') {
            var nmObj = String(pool[sid].studentName || pool[sid].name || '').trim();
            if (nmObj) result.studentName = nmObj;
          }
        }
      }
      if (!result.studentName) result.studentName = 'مسافر عزیز';

      // جست‌وجوی پیشرفت ذخیره‌شده این دانش‌آموز برای بازی gid
      var fallbackState = null;
      for (var k = 0; k < listPools.length && !result.serverState; k++) {
        var src = parseJsonSafe(listPools[k]);
        if (!src) continue;

        if (Array.isArray(src)) {
          for (var j = 0; j < src.length; j++) {
            var rec = src[j];
            if (!rec || typeof rec !== 'object') continue;
            var recSid = String(rec.studentId || rec.sid || rec.id || '').trim();
            if (recSid !== sid) continue;
            var recGid = String(rec.gameId || rec.gid || '').trim();
            if (recGid && recGid !== gid) continue;
            var st = extractStateFromEntry(rec, gid);
            if (st) {
              if (recGid === gid) { result.serverState = st; break; }
              if (!fallbackState) fallbackState = st;
            }
          }
        } else if (typeof src === 'object') {
          var directCandidates = [
            src[sid + '_' + gid],
            src[gid + '_' + sid],
            src[sid] && src[sid][gid],
            src[gid] && src[gid][sid],
            src[sid]
          ];
          for (var c = 0; c < directCandidates.length; c++) {
            var cand = extractStateFromEntry(directCandidates[c], gid);
            if (cand) { result.serverState = cand; break; }
          }
        }
      }
      if (!result.serverState && fallbackState) {
        result.serverState = fallbackState;
      }

      // فیلتر سوالات اختصاصی معلم دقیقاً برای gameId === gid
      var rawQuestions = parseJsonSafe(
        data.questions || raw.questions || clsObj.questions || []
      );
      if (Array.isArray(rawQuestions)) {
        result.teacherQuestions = rawQuestions.filter(function (q) {
          return q && typeof q === 'object' && String(q.gameId || '').trim() === gid;
        });
      }

      return result;
    }

    function safeJsonForInlineScript(obj) {
      return JSON.stringify(obj)
        .replace(/</g, '\\u003c')
        .replace(/>/g, '\\u003e')
        .replace(/\u2028/g, '\\u2028')
        .replace(/\u2029/g, '\\u2029');
    }

    /* =========================================================
       3. ساخت استایل و اسکریپت پل ارتباطی تزریقی داخل patchedHtml
       ========================================================= */
    function buildBridgeStyle() {
      return (
        '<style id="fanoos-bridge-style">\n' +
        '  /* مخفی‌سازی صفحه ورود، تابلوی کلاس و پنل معلم قدیمی بدون حذف از DOM */\n' +
        '  #splash-screen,\n' +
        '  #modal-welcome,\n' +
        '  #btn-leaderboard,\n' +
        '  #modal-leaderboard,\n' +
        '  #modal-confirm-delete-guest,\n' +
        '  button[onclick*="openLeaderboardModal"],\n' +
        '  .fanoos-hidden {\n' +
        '    display: none !important;\n' +
        '  }\n' +
        '  /* پاکسازی ردیف‌ها و کارت تماس در پنجره تنظیمات */\n' +
        '  #modal-settings .settings-section:has(.contact-box),\n' +
        '  #modal-settings .setting-row:has(button[onclick*="openWelcomeModal"]),\n' +
        '  #modal-settings .setting-row:has(button[onclick*="openLeaderboardModal"]) {\n' +
        '    display: none !important;\n' +
        '  }\n' +
        '  /* دکمه تالار متصل به متغیرهای رنگی و تم پویای نوار بالای بازی */\n' +
        '  #fanoos-hall-btn {\n' +
        '    text-decoration: none;\n' +
        '    border: 1.5px solid var(--parchment-border);\n' +
        '    background: #fffaf0;\n' +
        '    color: var(--ink);\n' +
        '    transition: opacity 0.2s ease, background 0.2s ease, transform 0.14s ease, border-color 0.6s ease, color 0.6s ease;\n' +
        '  }\n' +
        '  #fanoos-hall-btn:hover {\n' +
        '    background: #f5e6c8;\n' +
        '    border-color: var(--gold);\n' +
        '    transform: translateY(-1px);\n' +
        '  }\n' +
        '  body.night-ui #fanoos-hall-btn {\n' +
        '    background: rgba(24, 42, 78, 0.92);\n' +
        '    color: #fff4d4;\n' +
        '    border-color: rgba(235, 192, 96, 0.55);\n' +
        '  }\n' +
        '  body.night-ui #fanoos-hall-btn:hover {\n' +
        '    background: rgba(38, 62, 110, 0.96);\n' +
        '  }\n' +
        '  body.dawn-ui #fanoos-hall-btn {\n' +
        '    background: rgba(28, 48, 82, 0.94);\n' +
        '    color: #fff5d8;\n' +
        '    border-color: rgba(248, 206, 112, 0.85);\n' +
        '  }\n' +
        '  /* مخفی شدن دکمه تالار هنگام باز بودن هر مودال تا روی دکمه بستن نیفتد */\n' +
        '  body.fanoos-modal-open #fanoos-hall-btn {\n' +
        '    opacity: 0 !important;\n' +
        '    pointer-events: none !important;\n' +
        '    visibility: hidden !important;\n' +
        '  }\n' +
        '  /* پیام ظریف ۲ ثانیه‌ای ذخیره ابری پایین صفحه */\n' +
        '  #fanoos-save-pill {\n' +
        '    position: fixed;\n' +
        '    bottom: 14px;\n' +
        '    left: 50%;\n' +
        '    transform: translateX(-50%) translateY(14px);\n' +
        '    opacity: 0;\n' +
        '    visibility: hidden;\n' +
        '    z-index: 1350;\n' +
        '    pointer-events: none;\n' +
        '    background: rgba(18, 86, 85, 0.94);\n' +
        '    color: #fff8e2;\n' +
        '    border: 1.5px solid var(--gold-light);\n' +
        '    border-radius: 999px;\n' +
        '    padding: 5px 14px;\n' +
        '    font-size: 12px;\n' +
        '    font-weight: 800;\n' +
        '    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.34);\n' +
        '    transition: opacity 0.28s ease, transform 0.28s ease, visibility 0.28s ease;\n' +
        '    white-space: nowrap;\n' +
        '  }\n' +
        '  #fanoos-save-pill.show {\n' +
        '    opacity: 1;\n' +
        '    visibility: visible;\n' +
        '    transform: translateX(-50%) translateY(0);\n' +
        '  }\n' +
        '  body.night-ui #fanoos-save-pill {\n' +
        '    background: rgba(14, 28, 56, 0.95);\n' +
        '    border-color: rgba(248, 216, 120, 0.78);\n' +
        '  }\n' +
        '  /* مودال صندوقچه سوال استاد */\n' +
        '  #fanoos-teacher-modal {\n' +
        '    z-index: 1200;\n' +
        '  }\n' +
        '  .ftq-meta-row {\n' +
        '    display: flex;\n' +
        '    align-items: center;\n' +
        '    justify-content: space-between;\n' +
        '    gap: 8px;\n' +
        '    margin-bottom: 10px;\n' +
        '    flex-wrap: wrap;\n' +
        '  }\n' +
        '  .ftq-counter {\n' +
        '    font-size: 12px;\n' +
        '    font-weight: 800;\n' +
        '    color: var(--turquoise-dark);\n' +
        '    background: rgba(29, 122, 120, 0.12);\n' +
        '    padding: 3px 10px;\n' +
        '    border-radius: 999px;\n' +
        '  }\n' +
        '  body.night-ui .ftq-counter {\n' +
        '    color: #82e6df;\n' +
        '    background: rgba(82, 207, 199, 0.16);\n' +
        '  }\n' +
        '  .ftq-question-text {\n' +
        '    font-size: 15px;\n' +
        '    font-weight: 800;\n' +
        '    line-height: 1.8;\n' +
        '    margin: 0 0 12px;\n' +
        '  }\n' +
        '  .ftq-footer {\n' +
        '    margin-top: 14px;\n' +
        '    display: flex;\n' +
        '    justify-content: flex-end;\n' +
        '    gap: 8px;\n' +
        '  }\n' +
        '</style>\n'
      );
    }

    function buildBridgeScript(payloadObj) {
      var serialized = safeJsonForInlineScript(payloadObj);

      /* کد پل ارتباطی به‌صورت یک تابع مستقل که پس از سریال‌سازی داخل patchedHtml تزریق می‌شود */
      function injectedBridgeMain(CFG) {
        'use strict';

        if (window.__FANOOS_SALEH_BOOTED__) return;
        window.__FANOOS_SALEH_BOOTED__ = true;

        var LOCAL_KEY = 'fanoos_state_' + CFG.classId + '_' + CFG.gid + '_' + CFG.sid;
        var displayClass = CFG.className
          ? (/^کلاس\s/.test(CFG.className) ? CFG.className : 'کلاس ' + CFG.className)
          : '';
        var certSubtitle = displayClass || 'فانوس یادگیری';
        var certSignature = displayClass ? (displayClass + ' • فانوس یادگیری') : 'فانوس یادگیری';

        /* ---- نرمال‌سازی و ادغام state با ۱۰ کلید استاندارد ---- */
        function sanitizeMistakes(raw) {
          var out = {};
          if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return out;
          Object.keys(raw).forEach(function (k) {
            var n = Math.max(0, Math.floor(Number(raw[k]) || 0));
            if (n > 0) out[String(k)] = n;
          });
          return out;
        }

        function sanitizeTeacherAnswers(raw) {
          var out = {};
          if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return out;
          Object.keys(raw).forEach(function (k) {
            var item = raw[k];
            if (!item || typeof item !== 'object') return;
            out[String(k)] = {
              chosenIndex: Number(item.chosenIndex),
              isCorrect: Boolean(item.isCorrect),
              stationId: Number(item.stationId || 0)
            };
          });
          return out;
        }

        function buildStandardState(src) {
          var r = (src && typeof src === 'object') ? src : {};
          var completed = Array.isArray(r.completedStations)
            ? Array.from(new Set(r.completedStations.map(Number).filter(function (n) { return n >= 1 && n <= 10; })))
            : [];
          var highest = Math.max(1, Math.min(10, Number(r.highestUnlocked || 1)));
          if (completed.indexOf(9) !== -1 && highest < 10) highest = 10;
          completed.forEach(function (n) {
            if (n < 10 && highest <= n) highest = n + 1;
          });
          var cards = Array.isArray(r.collectedCards) ? Array.from(new Set(r.collectedCards.map(String))) : [];
          var secrets = Array.isArray(r.discoveredSecrets) ? Array.from(new Set(r.discoveredSecrets.map(String))) : [];
          var pledges = Array.isArray(r.pledgeChoices)
            ? Array.from(new Set(r.pledgeChoices.map(Number).filter(function (n) { return !isNaN(n); })))
            : [];

          return {
            highestUnlocked: highest,
            completedStations: completed,
            collectedCards: cards,
            discoveredSecrets: secrets,
            mistakes: sanitizeMistakes(r.mistakes),
            teacherAnswers: sanitizeTeacherAnswers(r.teacherAnswers),
            pledgeChoices: pledges,
            personalNote: typeof r.personalNote === 'string' ? r.personalNote : '',
            finishedGame: Boolean(r.finishedGame || completed.indexOf(10) !== -1),
            seenGuide: Boolean(r.seenGuide)
          };
        }

        function mergeStandardStates(localRaw, serverRaw) {
          var a = buildStandardState(localRaw);
          var b = buildStandardState(serverRaw);
          var mergedMistakes = {};
          Object.keys(a.mistakes).forEach(function (k) { mergedMistakes[k] = a.mistakes[k]; });
          Object.keys(b.mistakes).forEach(function (k) {
            mergedMistakes[k] = Math.max(mergedMistakes[k] || 0, b.mistakes[k]);
          });
          var mergedAnswers = {};
          Object.keys(a.teacherAnswers).forEach(function (k) { mergedAnswers[k] = a.teacherAnswers[k]; });
          Object.keys(b.teacherAnswers).forEach(function (k) { mergedAnswers[k] = b.teacherAnswers[k]; });

          return buildStandardState({
            highestUnlocked: Math.max(a.highestUnlocked, b.highestUnlocked),
            completedStations: a.completedStations.concat(b.completedStations),
            collectedCards: a.collectedCards.concat(b.collectedCards),
            discoveredSecrets: a.discoveredSecrets.concat(b.discoveredSecrets),
            mistakes: mergedMistakes,
            teacherAnswers: mergedAnswers,
            pledgeChoices: b.pledgeChoices.length ? b.pledgeChoices : a.pledgeChoices,
            personalNote: b.personalNote.trim() ? b.personalNote : a.personalNote,
            finishedGame: a.finishedGame || b.finishedGame,
            seenGuide: a.seenGuide || b.seenGuide
          });
        }

        function readLocalBackup() {
          try {
            var raw = localStorage.getItem(LOCAL_KEY);
            return raw ? JSON.parse(raw) : null;
          } catch (e) {
            return null;
          }
        }

        function writeLocalBackup(stdState) {
          try {
            localStorage.setItem(LOCAL_KEY, JSON.stringify(stdState));
          } catch (e) {}
        }

        /* ---- پیام ظریف ۲ ثانیه‌ای ذخیره ---- */
        var savePillEl = null;
        var savePillTimer = null;
        function ensureSavePill() {
          if (savePillEl && document.body.contains(savePillEl)) return savePillEl;
          savePillEl = document.createElement('div');
          savePillEl.id = 'fanoos-save-pill';

          document.body.appendChild(savePillEl);

        function showSavePill() {
          var el = ensureSavePill();

            el.classList.remove('show');
          }, 2000);
        }

        /* ---- همگام‌سازی زنده با سرور (POST + keepalive) ---- */
        var saveTimer = null;
        var hasDirtySave = false;

        function postProgressNow(stdState) {
          hasDirtySave = false;
          if (!CFG.apiUrl) {
            showSavePill();
            return;
          }
          var bodyStr = JSON.stringify({
            action: 'saveProgress',
            classId: CFG.classId,
            studentId: CFG.sid,
            studentName: CFG.sname,
            gameId: CFG.gid,
            state: stdState
          });
          try {
            fetch(CFG.apiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              keepalive: true,
              body: bodyStr
            }).then(function () {
              showSavePill();
            }).catch(function () {});
          } catch (e) {}
        }

        function flushPendingSave() {
          if (saveTimer) {
            clearTimeout(saveTimer);
            saveTimer = null;
          }
          if (!hasDirtySave || !state) return;
          var stdState = buildStandardState(state);
          writeLocalBackup(stdState);
          postProgressNow(stdState);
        }

        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'hidden') flushPendingSave();
        });
        window.addEventListener('pagehide', flushPendingSave);

        /* ---- بازنویسی توابع ذخیره و ریست و غیرفعال‌سازی ورود/لیدربرد قدیمی ---- */

          hasDirtySave = true;
          if (saveTimer) {
            clearTimeout(saveTimer);
            saveTimer = null;
          }
          if (opts && (opts.immediate || opts.isReset)) {
            postProgressNow(stdState);

        /* ---- رادار اشتباهات هر ایستگاه در state.mistakes[String(N)] ---- */
        var inGoToCard = false;

        function recordStationMistake(stId) {
          var n = Number(stId || 0);
          if (!state || n < 1 || n > 10) return;
          var key = String(n);
          if (!state.mistakes || typeof state.mistakes !== 'object') state.mistakes = {};
          state.mistakes[key] = (Number(state.mistakes[key]) || 0) + 1;
          saveCurrentStudentState();

        if (typeof goToStationCard === 'function') {

              inGoToCard = false;

          };

        if (typeof AudioEngine !== 'undefined' && AudioEngine && typeof AudioEngine.playSfx === 'function') {

            var stationOpen = stModal && stModal.classList.contains('open');

              lastHintMistakeAt = Date.now();

            }
            return origPlaySfx.apply(this, arguments);

        /* پشتیبان سبک برای ثبت خطا در صورت افزوده‌شدن کلاس nudge یا chosen-warn */
        document.addEventListener('click', function (ev) {
          var content = document.getElementById('station-modal-content');
          var stModal = document.getElementById('modal-station');
          var tqModal = document.getElementById('fanoos-teacher-modal');
          if (!content || !stModal || !stModal.classList.contains('open')) return;
          if (tqModal && tqModal.classList.contains('open')) return;
          var btn = ev.target && ev.target.closest ? ev.target.closest('button') : null;
          if (!btn || !content.contains(btn)) return;
          var hadWarn = btn.classList.contains('nudge') || btn.classList.contains('chosen-warn');
          setTimeout(function () {
            if (Date.now() - lastHintMistakeAt <= 120) return;
            var hasWarnNow = btn.classList.contains('nudge') || btn.classList.contains('chosen-warn');
            if (hasWarnNow && !hadWarn) {
              lastHintMistakeAt = Date.now();
              recordStationMistake(typeof activeStationId !== 'undefined' ? activeStationId : 1);
            }
          }, 40);
        }, true);

        /* ---- مودال «🎁 صندوقچه سوال استاد» پس از تکمیل هر ایستگاه ---- */
        var tqQueue = [];
        var tqIndex = 0;
        var tqStationId = 0;

        function getQuestionId(q, fallbackIdx) {
          return String(q.id || q.qId || q.questionId || ('q_' + (q.stationId || 0) + '_' + fallbackIdx));
        }

        function ensureTeacherModal() {

        function closeTeacherModal() {
          var el = document.getElementById('fanoos-teacher-modal');

        function renderTeacherQuestionStep() {
          var modal = ensureTeacherModal();
          var card = document.getElementById('fanoos-teacher-card');
          var item = tqQueue[tqIndex];
          if (!item || !card) {
            closeTeacherModal();
            return;
          }

          var q = item.q;
          var qId = item.qId;
          var qText = String(q.question || q.text || q.prompt || 'سوال اختصاصی استاد:');
          var options = Array.isArray(q.options) ? q.options : (Array.isArray(q.choices) ? q.choices : []);
          var correctIdx = Number(
            q.correctIndex !== undefined ? q.correctIndex :
            (q.answerIndex !== undefined ? q.answerIndex :
            (q.correct !== undefined ? q.correct : 0))
          );
          var explanation = String(q.explanation || q.feedback || '').trim();
          var faNum = typeof toFaNum === 'function' ? toFaNum : function (v) { return String(v); };

          var optsHtml = options.map(function (optText, idx) {
            return '<button type="button" class="opt-btn ftq-opt" data-idx="' + idx + '">' +
              faNum(idx + 1) + '. ' + String(optText).replace(/</g, '&lt;').replace(/>/g, '&gt;') +
            '</button>';
          }).join('');

          card.innerHTML =
            '<div class="modal-head">' +
              '<h3>🎁 صندوقچه سوال استاد</h3>' +
              '<button type="button" class="modal-close" id="ftq-close-x" title="بستن">×</button>' +
            '</div>' +
            '<div class="ftq-meta-row">' +
              '<span class="station-badge" style="margin:0;">ایستگاه ' + faNum(tqStationId) + '</span>' +
              '<span class="ftq-counter">سوال ' + faNum(tqIndex + 1) + ' از ' + faNum(tqQueue.length) + '</span>' +
            '</div>' +
            '<div class="challenge-box" style="margin-bottom:0;">' +
              '<div class="ftq-question-text">' + qText.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</div>' +
              '<div class="options-list" id="ftq-options">' + optsHtml + '</div>' +
              '<div id="ftq-fb" class="feedback-box"></div>' +
            '</div>' +
            '<div class="ftq-footer">' +
              '<button type="button" class="primary-btn hidden" id="ftq-next-btn">' +
                (tqIndex + 1 < tqQueue.length ? 'سوال بعدی ◀' : 'ادامه سفر ✨') +
              '</button>' +
            '</div>';

          var closeBtn = document.getElementById('ftq-close-x');
          if (closeBtn) closeBtn.addEventListener('click', closeTeacherModal);

          var nextBtn = document.getElementById('ftq-next-btn');
          if (nextBtn) {
            nextBtn.addEventListener('click', function () {
              if (tqIndex + 1 < tqQueue.length) {
                tqIndex++;
                renderTeacherQuestionStep();
              } else {
                closeTeacherModal();
              }
            });
          }

          var optBtns = card.querySelectorAll('.ftq-opt');
          optBtns.forEach(function (btn) {
            btn.addEventListener('click', function () {
              var chosenIdx = Number(btn.getAttribute('data-idx'));
              var isCorrect = chosenIdx === correctIdx;

              optBtns.forEach(function (b) {
                b.disabled = true;
                var bIdx = Number(b.getAttribute('data-idx'));
                if (bIdx === correctIdx) b.classList.add('correct');
              });
              if (!isCorrect) btn.classList.add('nudge');

              try {
                if (typeof AudioEngine !== 'undefined' && AudioEngine.playSfx) {
                  AudioEngine.playSfx(isCorrect ? 'correct' : 'hint');
                }
              } catch (e) {}

              if (!state.teacherAnswers || typeof state.teacherAnswers !== 'object') {
                state.teacherAnswers = {};
              }
              state.teacherAnswers[qId] = {
                chosenIndex: chosenIdx,
                isCorrect: isCorrect,
                stationId: Number(tqStationId)
              };
              saveCurrentStudentState({ immediate: true });

              var fb = document.getElementById('ftq-fb');
              if (fb) {
                fb.className = 'feedback-box show ' + (isCorrect ? 'success' : 'hint');
                fb.innerHTML =
                  (isCorrect
                    ? '<strong>🌟 آفرین! پاسخ درست بود و برای معلمت ثبت شد.</strong>'
                    : '<strong>💡 پاسخ تو ثبت شد؛ گزینه درست با رنگ سبز مشخص شده است.</strong>') +
                  (explanation ? '<div style="margin-top:6px;">' + explanation.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</div>' : '');
              }
              if (nextBtn) nextBtn.classList.remove('hidden');
            });
          });

          modal.classList.add('open');
          try { if (typeof syncBgThrottle === 'function') syncBgThrottle(); } catch (e) {}
          syncModalOpenClass();
        }

        function checkTeacherQuestionsForStation(stationId) {
          var qs = Array.isArray(CFG.teacherQuestions) ? CFG.teacherQuestions : [];
          if (!qs.length || !state) return;
          var answers = (state.teacherAnswers && typeof state.teacherAnswers === 'object') ? state.teacherAnswers : {};
          var pending = [];

          for (var i = 0; i < qs.length; i++) {
            var q = qs[i];
            if (Number(q.stationId) !== Number(stationId)) continue;
            var qId = getQuestionId(q, i);
            if (!answers[qId]) {
              pending.push({ q: q, qId: qId });
            }
          }

          if (!pending.length) return;
          tqQueue = pending;
          tqIndex = 0;
          tqStationId = Number(stationId);
          setTimeout(function () {
            renderTeacherQuestionStep();
          }, 520);
        }

        if (window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype.fillText) {

          CanvasRenderingContext2D.prototype.fillText = function (text, x, y, maxWidth) {
            var cvs = this.canvas;
            if (cvs && cvs.id !== 'world-canvas' && cvs.id !== 'celebration-canvas') {
              var s = String(text == null ? '' : text);
              if (s.indexOf('پایه ششم') !== -1 || s.indexOf('کلاس ششم') !== -1) {

              return arguments.length >= 4
                ? origFillText.call(this, s, x, y, maxWidth)
                : origFillText.call(this, s, x, y);

            return origFillText.apply(this, arguments);
          };

        /* ---- ورود خودکار و راه‌اندازی کامل دنیای بازی ---- */
        var autoLoggedIn = false;

          writeLocalBackup(merged);

          var splash = document.getElementById('splash-screen');
          if (splash) splash.classList.add('hidden');
          var wm = document.getElementById('modal-welcome');
          if (wm) wm.classList.remove('open');

          var startPos = state.finishedGame ? 10 : state.highestUnlocked;
          try {
            if (typeof World3D !== 'undefined' && World3D) {
              World3D.setSplashPan(false);
              World3D.resetWildlife();
              World3D.jumpImmediate(startPos, true);
            }
            if (typeof syncAtmosphereUI === 'function') syncAtmosphereUI(startPos, true);
            if (typeof updateHudAndDock === 'function') updateHudAndDock();
            if (!state.seenGuide && typeof showOneTimeOnboardTip === 'function') {
              showOneTimeOnboardTip();
            }
          } catch (e) {}

          watchModalsForHallButton();
          watchStationModalContent();
        }

        bootAutoLogin();
        document.addEventListener('DOMContentLoaded', bootAutoLogin);
        setTimeout(function () {
          injectHallButton();
          cleanupSettingsModal();
          cleanupSkyStarAndModal();
          try { if (typeof updateHudAndDock === 'function') updateHudAndDock(); } catch (e) {}
          syncModalOpenClass();
        }, 250);
      }

      return (
        '<script id="fanoos-bridge-script">\n' +
        '(' + injectedBridgeMain.toString() + ')(' + serialized + ');\n' +
        '<' + '/script>\n'
      );
    }

    /* =========================================================
       4. واکشی هم‌زمان core.html و اطلاعات کلاس از API فانوس
       ========================================================= */
    var apiUrl = (window.FANOOS_CONFIG && window.FANOOS_CONFIG.apiUrl)
      ? String(window.FANOOS_CONFIG.apiUrl).trim()
      : '';

    var corePromise = fetch('./core.html', { cache: 'no-store' }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    });

    var apiPromise = apiUrl
      ? fetch(
          apiUrl +
          '?action=getClass&classId=' + encodeURIComponent(classId) +
          '&t=' + Date.now()
        ).then(function (res) {
          if (!res.ok) return null;
          return res.json();
        }).catch(function () {
          return null;
        })
      : Promise.resolve(null);

    Promise.all([corePromise, apiPromise]).then(function (results) {
      var coreHtml = results[0];
      var apiRaw = results[1];
      var bundle = extractApiBundle(apiRaw);

      // خنثی‌سازی آدرس قدیمی Google Apps Script در core.html
      var patchedHtml = coreHtml.replace(
        /const\s+CLOUD_API_URL\s*=\s*['"][^'"]*['"]\s*;/,
        "const CLOUD_API_URL = '';"
      );

      var headCloseTag = '<' + '/head>';
      var bodyCloseTag = '<' + '/body>';
      var styleBlock = buildBridgeStyle();
      var scriptBlock = buildBridgeScript({
        classId: classId,
        className: bundle.className,
        sid: sid,
        sname: bundle.studentName,
        gid: gid,
        age: age,
        apiUrl: apiUrl,
        serverState: bundle.serverState,
        teacherQuestions: bundle.teacherQuestions
      });

      if (patchedHtml.indexOf(headCloseTag) !== -1) {
        patchedHtml = patchedHtml.replace(headCloseTag, styleBlock + headCloseTag);
      } else {
        patchedHtml = styleBlock + patchedHtml;
      }

      if (patchedHtml.indexOf(bodyCloseTag) !== -1) {
        patchedHtml = patchedHtml.replace(bodyCloseTag, scriptBlock + bodyCloseTag);
      } else {
        patchedHtml = patchedHtml + scriptBlock;
      }

      document.open();
      document.write(patchedHtml);
      document.close();
    }).catch(function (err) {
      showLoadError(err && err.message ? err.message : '');
    });
  })();
  </script>
</body>
</html>

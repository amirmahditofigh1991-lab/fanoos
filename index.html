<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1120" />
  <title>فانوس یادگیری | تالار دانش‌آموز</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="config.js"></script>
  <style>
    :root {
      --bg-base: #0b1120;
      --bg-elevated: #111827;
      --bg-glass: rgba(17, 24, 39, 0.76);
      --bg-glass-strong: rgba(17, 24, 39, 0.92);
      --bg-surface: rgba(15, 23, 42, 0.62);
      --border-subtle: rgba(148, 163, 184, 0.14);
      --border-strong: rgba(148, 163, 184, 0.26);

      /* Lantern Gold (Games) */
      --gold: #f59e0b;
      --gold-light: #fbbf24;
      --gold-soft: rgba(245, 158, 11, 0.14);
      --gold-border: rgba(245, 158, 11, 0.34);

      /* Teal / Turquoise (Checklist) */
      --teal: #14b8a6;
      --teal-light: #2dd4bf;
      --teal-soft: rgba(20, 184, 166, 0.14);
      --teal-border: rgba(20, 184, 166, 0.34);

      /* Semantic */
      --emerald: #34d399;
      --rose: #fb7185;
      --rose-soft: rgba(251, 113, 133, 0.14);
      --text-main: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      --radius-xl: 22px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 10px;
      --shadow-card: 0 16px 38px -14px rgba(0, 0, 0, 0.6);
      --ease: 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100%;
      font-family: 'Vazirmatn', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      line-height: 1.65;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-image:
        radial-gradient(ellipse 75% 48% at 85% -8%, rgba(245, 158, 11, 0.12), transparent 60%),
        radial-gradient(ellipse 70% 45% at 12% 10%, rgba(20, 184, 166, 0.12), transparent 58%),
        linear-gradient(180deg, #0b1120 0%, #0f172a 55%, #111827 100%);
      background-attachment: fixed;
    }

    button, input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .hidden {
      display: none !important;
    }

    .app-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* ============ Shared Components ============ */
    .glass-card {
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-card);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 46px;
      padding: 10px 18px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.94rem;
      transition: transform var(--ease), background var(--ease), border-color var(--ease), box-shadow var(--ease), opacity var(--ease);
      white-space: nowrap;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .btn-gold {
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
      color: #0b1120;
      box-shadow: 0 8px 24px -8px rgba(245, 158, 11, 0.45);
    }

    .btn-gold:hover:not(:disabled) {
      background: linear-gradient(135deg, #fcd34d 0%, #fbbf24 100%);
      transform: translateY(-1px);
    }

    .btn-teal {
      background: linear-gradient(135deg, #2dd4bf 0%, #14b8a6 100%);
      color: #042f2e;
      box-shadow: 0 8px 24px -8px rgba(20, 184, 166, 0.45);
    }

    .btn-teal:hover:not(:disabled) {
      background: linear-gradient(135deg, #5eead4 0%, #2dd4bf 100%);
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
    }

    .btn-ghost:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.09);
      border-color: var(--border-strong);
      color: var(--text-main);
    }

    .btn-sm {
      min-height: 36px;
      padding: 6px 12px;
      font-size: 0.82rem;
      border-radius: var(--radius-sm);
    }

    .btn-icon {
      width: 36px;
      height: 36px;
      min-height: 36px;
      padding: 0;
      border-radius: var(--radius-sm);
      flex-shrink: 0;
    }

    .input-field {
      width: 100%;
      min-height: 48px;
      padding: 11px 15px;
      border-radius: var(--radius-md);
      border: 1.5px solid rgba(148, 163, 184, 0.22);
      background: rgba(11, 17, 32, 0.78);
      color: var(--text-main);
      font-size: 0.98rem;
      outline: none;
      transition: border-color var(--ease), box-shadow var(--ease);
    }

    .input-field::placeholder {
      color: var(--text-dim);
    }

    .input-field:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.14);
    }

    .input-field.teal-focus:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.14);
    }

    .center-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      gap: 18px;
    }

    .fade-in {
      animation: fadeSlide 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes fadeSlide {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spinning {
      display: inline-block;
      animation: spin 0.8s linear infinite;
    }

    /* ============ 1. Class Code Entry Screen ============ */
    .entry-card {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px 26px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .entry-card::before {
      content: "";
      position: absolute;
      top: 0;
      inset-inline: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), var(--teal), transparent);
    }

    .lantern-badge {
      width: 68px;
      height: 68px;
      margin: 0 auto 16px;
      border-radius: 20px;
      background: linear-gradient(145deg, rgba(245, 158, 11, 0.2), rgba(20, 184, 166, 0.14));
      border: 1px solid rgba(245, 158, 11, 0.36);
      display: grid;
      place-items: center;
      font-size: 2rem;
      box-shadow: 0 0 32px rgba(245, 158, 11, 0.18);
    }

    .entry-title {
      font-size: 1.55rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 15%, #fde68a 60%, #5eead4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .entry-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .entry-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: right;
    }

    .field-label {
      display: block;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .code-input {
      direction: ltr;
      text-align: center;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 0.1em;
    }

    .code-input::placeholder {
      font-weight: 400;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }

    .form-error {
      min-height: 20px;
      font-size: 0.82rem;
      color: var(--rose);
      text-align: center;
      font-weight: 500;
    }

    .teacher-subtle-link {
      font-size: 0.82rem;
      color: var(--text-dim);
      padding: 8px 14px;
      border-radius: 999px;
      transition: color var(--ease), background var(--ease);
    }

    .teacher-subtle-link:hover {
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.04);
    }

    /* ============ Loading & Error States ============ */
    .state-card {
      width: 100%;
      max-width: 400px;
      padding: 34px 24px;
      text-align: center;
    }

    .loader-ring {
      width: 56px;
      height: 56px;
      margin: 0 auto 18px;
      position: relative;
      display: grid;
      place-items: center;
    }

    .loader-ring::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid rgba(148, 163, 184, 0.16);
      border-top-color: var(--gold);
      border-right-color: var(--teal);
      animation: spin 0.9s linear infinite;
    }

    .loader-ring span {
      font-size: 1.35rem;
    }

    .state-title {
      font-size: 1.08rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .state-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .state-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    /* ============ 2. Student Identity Picker View ============ */
    .identity-card {
      width: 100%;
      max-width: 560px;
      padding: 26px 20px 22px;
      position: relative;
      overflow: hidden;
    }

    .identity-card::before {
      content: "";
      position: absolute;
      top: 0;
      inset-inline: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--teal), var(--gold));
    }

    .identity-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .identity-class-title {
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--text-main);
      line-height: 1.35;
    }

    .identity-teacher {
      font-size: 0.84rem;
      color: var(--teal-light);
      font-weight: 600;
      margin-top: 3px;
    }

    .identity-prompt {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .students-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      max-height: 46vh;
      overflow-y: auto;
      padding: 2px;
      margin-bottom: 18px;
    }

    .student-tile {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 13px;
      border-radius: var(--radius-md);
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid var(--border-subtle);
      text-align: right;
      transition: transform var(--ease), border-color var(--ease), background var(--ease);
      min-height: 54px;
    }

    .student-tile:hover {
      background: rgba(245, 158, 11, 0.1);
      border-color: var(--gold-border);
      transform: translateY(-1px);
    }

    .student-tile:active {
      transform: scale(0.98);
    }

    .student-avatar {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.22), rgba(20, 184, 166, 0.18));
      border: 1px solid rgba(245, 158, 11, 0.3);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 0.88rem;
      color: var(--gold-light);
    }

    .student-tile-name {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty-roster-note {
      grid-column: 1 / -1;
      text-align: center;
      padding: 16px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed var(--border-subtle);
      color: var(--text-muted);
      font-size: 0.86rem;
    }

    .guest-section {
      padding-top: 16px;
      border-top: 1px solid var(--border-subtle);
    }

    .guest-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .guest-panel {
      margin-top: 12px;
      padding: 14px;
      border-radius: var(--radius-lg);
      background: rgba(11, 17, 32, 0.62);
      border: 1px solid var(--border-subtle);
    }

    .guest-form {
      display: flex;
      gap: 8px;
    }

    .guest-form .input-field {
      min-height: 44px;
      font-size: 0.92rem;
    }

    .guest-error {
      font-size: 0.8rem;
      color: var(--rose);
      margin-top: 6px;
      min-height: 18px;
    }

    /* ============ 3. Hall Header (Clean Mobile-First Flexbox) ============ */
    .hall-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(11, 17, 32, 0.86);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 0;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px 14px;
      flex-wrap: wrap;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1 1 180px;
    }

    .header-logo {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border-radius: 11px;
      background: linear-gradient(145deg, rgba(245, 158, 11, 0.22), rgba(20, 184, 166, 0.16));
      border: 1px solid rgba(245, 158, 11, 0.35);
      display: grid;
      place-items: center;
      font-size: 1.2rem;
    }

    .header-class-wrap {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .header-class-name {
      font-size: 0.98rem;
      font-weight: 800;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .header-platform-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      max-width: 100%;
    }

    .student-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-main);
      max-width: 148px;
    }

    .student-badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--teal-light);
      flex-shrink: 0;
    }

    .student-badge-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ============ Hall Main Body ============ */
    .hall-main {
      flex: 1;
      padding: 22px 0 42px;
    }

    /* Greeting Banner */
    .greeting-block {
      margin-bottom: 22px;
    }

    .greeting-title {
      font-size: 1.22rem;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.5;
    }

    .greeting-title .name-highlight {
      color: var(--gold-light);
    }

    .greeting-sub {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* ============ Folder Cards (Phase 2 Hub) ============ */
    .folders-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .folder-card {
      position: relative;
      display: flex;
      flex-direction: column;
      text-align: right;
      width: 100%;
      padding: 22px 20px 18px;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      transition: transform var(--ease), border-color var(--ease), box-shadow var(--ease);
    }

    .folder-card::before {
      content: "";
      position: absolute;
      top: 0;
      inset-inline: 0;
      height: 3px;
      opacity: 0.9;
    }

    .folder-card::after {
      content: "";
      position: absolute;
      top: -50px;
      left: -50px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.55;
      transition: opacity var(--ease);
    }

    .folder-card:hover {
      transform: translateY(-3px);
    }

    .folder-card:active {
      transform: scale(0.985);
    }

    /* Gold Theme - Games Folder */
    .folder-card.theme-games::before {
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
    }

    .folder-card.theme-games::after {
      background: radial-gradient(circle, rgba(245, 158, 11, 0.16), transparent 68%);
    }

    .folder-card.theme-games:hover {
      border-color: var(--gold-border);
      box-shadow: 0 20px 42px -14px rgba(0, 0, 0, 0.7), 0 0 26px -10px rgba(245, 158, 11, 0.35);
    }

    /* Teal Theme - Checklist Folder */
    .folder-card.theme-checklist::before {
      background: linear-gradient(90deg, var(--teal), var(--teal-light));
    }

    .folder-card.theme-checklist::after {
      background: radial-gradient(circle, rgba(20, 184, 166, 0.16), transparent 68%);
    }

    .folder-card.theme-checklist:hover {
      border-color: var(--teal-border);
      box-shadow: 0 20px 42px -14px rgba(0, 0, 0, 0.7), 0 0 26px -10px rgba(20, 184, 166, 0.35);
    }

    .folder-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      position: relative;
      z-index: 1;
    }

    .folder-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-size: 1.75rem;
      flex-shrink: 0;
    }

    .theme-games .folder-icon {
      background: var(--gold-soft);
      border: 1px solid var(--gold-border);
    }

    .theme-checklist .folder-icon {
      background: var(--teal-soft);
      border: 1px solid var(--teal-border);
    }

    .folder-arrow {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      display: grid;
      place-items: center;
      color: var(--text-muted);
      font-size: 1rem;
      transition: transform var(--ease), color var(--ease), border-color var(--ease);
    }

    .folder-card:hover .folder-arrow {
      transform: translateX(-3px);
      color: var(--text-main);
    }

    .folder-title {
      font-size: 1.16rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 4px;
      position: relative;
      z-index: 1;
    }

    .folder-subtitle {
      font-size: 0.87rem;
      color: var(--text-muted);
      margin-bottom: 18px;
      position: relative;
      z-index: 1;
    }

    .folder-badges {
      margin-top: auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding-top: 14px;
      border-top: 1px solid var(--border-subtle);
      position: relative;
      z-index: 1;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius:
